services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: cosmetics-server
    network_mode: host
    env_file:
      - .env
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    container_name: cosmetics-admin
    network_mode: host
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  miniapp:
    build:
      context: .
      dockerfile: miniapp/Dockerfile
    container_name: cosmetics-miniapp
    network_mode: host
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  devops:
    build:
      context: .
      dockerfile: Dockerfile.devops
    container_name: cosmetics-devops
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ubuntu/app:/host/app
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - PROJECT_DIR=/host/app
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
