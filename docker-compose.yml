services:
  mock-server:
    build:
      context: .
      dockerfile: mock-server/Dockerfile
    container_name: cosmetics-mock-server
    ports:
      - "3000:3000"
    network_mode: host

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: cosmetics-server
    ports:
      - "3001:3001"
    network_mode: host
    environment:
      - DB_HOST=127.0.0.1
      - DB_PORT=3306
      - DB_USER=cosmetics
      - DB_PASSWORD=Cosmetics_123
      - DB_NAME=cosmetics_shop
      - JWT_SECRET=CosmeticsShop2024Secret
      - PAY_MODE=mock

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    container_name: cosmetics-admin
    ports:
      - "5174:80"
    network_mode: host