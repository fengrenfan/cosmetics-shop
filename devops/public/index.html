<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docker 管理控制台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.4.4/dist/index.css">
  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.15/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.4.4/dist/index.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #1a1a2e;
      --neon-pink: #ff2d7b;
      --neon-blue: #00d4ff;
      --neon-green: #00ff9d;
      --neon-purple: #b537f2;
      --neon-yellow: #ffe600;
      --text-primary: #e0e0e0;
      --text-secondary: #888;
      --border-color: #2a2a3e;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body { 
      font-family: 'Segoe UI', 'PingFang SC', sans-serif; 
      background: var(--bg-primary); 
      color: var(--text-primary);
      min-height: 100vh;
    }

    /* 背景网格 */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }

    /* 头部 */
    .header { 
      background: linear-gradient(180deg, rgba(26, 26, 46, 0.95), rgba(10, 10, 15, 0.95));
      border-bottom: 1px solid var(--neon-blue);
      padding: 16px 24px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      position: relative;
      z-index: 10;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
    }
    .header h1 { 
      font-size: 20px; 
      color: var(--neon-blue);
      display: flex; 
      align-items: center; 
      gap: 10px;
      text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
    }
    .header-right { display: flex; align-items: center; gap: 12px; }

    .container { 
      max-width: 1400px; 
      margin: 20px auto; 
      padding: 0 20px; 
      position: relative; 
      z-index: 1;
    }

    /* Git 状态栏 */
    .git-bar {
      background: var(--bg-card);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
    }
    .git-branch {
      background: rgba(0, 255, 157, 0.1);
      color: var(--neon-green);
      padding: 4px 12px;
      border-radius: 4px;
      font-weight: 500;
      border: 1px solid rgba(0, 255, 157, 0.3);
      text-shadow: 0 0 5px rgba(0, 255, 157, 0.5);
    }
    .git-commit { color: var(--text-secondary); }
    .git-changes { 
      background: rgba(255, 227, 0, 0.1); 
      color: var(--neon-yellow); 
      padding: 4px 12px; 
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid rgba(255, 227, 0, 0.3);
    }
    .git-changes:hover { background: rgba(255, 227, 0, 0.2); }

    /* 操作栏 */
    .action-bar {
      background: var(--bg-card);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 服务卡片网格 */
    .services-grid { 
      align-items: stretch; 
      display: grid; 
      grid-template-columns: repeat(4, 1fr); 
      gap: 16px; 
      margin-bottom: 20px; 
    }

    /* 服务卡片 - 赛博朋克风格 */
    .service-card { 
      min-width: 0; 
      background: var(--bg-card);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      overflow: visible;
      transition: all 0.3s ease;
      position: relative;
    }
    .service-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--neon-pink), var(--neon-blue), var(--neon-green));
    }
    .service-card:hover { 
      transform: translateY(-4px); 
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
      border-color: var(--neon-blue);
    }

    /* 卡片头部 */
    .card-header {
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
    }
    .card-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .card-icon.server { 
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(0, 212, 255, 0.05));
      border: 1px solid rgba(0, 212, 255, 0.3);
    }
    .card-icon.admin { 
      background: linear-gradient(135deg, rgba(255, 45, 123, 0.2), rgba(255, 45, 123, 0.05));
      border: 1px solid rgba(255, 45, 123, 0.3);
    }
    .card-icon.miniapp { 
      background: linear-gradient(135deg, rgba(181, 55, 242, 0.2), rgba(181, 55, 242, 0.05));
      border: 1px solid rgba(181, 55, 242, 0.3);
    }
    .card-icon.mock { 
      background: linear-gradient(135deg, rgba(0, 255, 157, 0.2), rgba(0, 255, 157, 0.05));
      border: 1px solid rgba(0, 255, 157, 0.3);
    }

    .card-title { flex: 1; }
    .card-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 2px;
    }
    .card-port {
      font-size: 12px;
      color: var(--text-secondary);
      font-family: 'Consolas', monospace;
    }

    /* 状态指示器 */
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 500;
    }
    .status-indicator.running {
      background: rgba(0, 255, 157, 0.1);
      color: var(--neon-green);
      border: 1px solid rgba(0, 255, 157, 0.3);
      text-shadow: 0 0 5px rgba(0, 255, 157, 0.5);
    }
    .status-indicator.stopped {
      background: rgba(255, 45, 123, 0.1);
      color: var(--neon-pink);
      border: 1px solid rgba(255, 45, 123, 0.3);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .status-indicator.running .status-dot {
      background: var(--neon-green);
      box-shadow: 0 0 6px var(--neon-green);
      animation: pulse 2s infinite;
    }
    .status-indicator.stopped .status-dot {
      background: var(--neon-pink);
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 6px var(--neon-green); }
      50% { opacity: 0.5; box-shadow: 0 0 12px var(--neon-green); }
    }

    /* 卡片内容 */
    .card-body { padding: 16px; }
    .card-desc {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .card-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-secondary);
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
      font-family: 'Consolas', monospace;
    }

    /* 卡片操作 */
    .card-actions {
      padding: 10px 12px;
      background: rgba(0, 0, 0, 0.2);
      border-top: 1px solid var(--border-color);
    }
    .btn-group {
      display: flex;
      gap: 6px;
    }
    .btn-group .el-button {
      flex: 1 1 0%;
      font-size: 10px;
      padding: 4px 2px !important;
      min-width: 0 !important;
      max-width: none !important;
      white-space: nowrap;
      text-align: center;
      box-sizing: border-box;
      border-radius: 4px !important;
    }
    .btn-group .el-button + .el-button {
      margin-left: 0 !important;
    }
    .btn-group .el-button__text {
      font-size: 10px;
    }

    /* 预览区域 */
    .preview-section { 
      background: var(--bg-card);
      border-radius: 12px;
      padding: 24px; 
      margin-bottom: 16px; 
      border: 1px solid var(--border-color);
    }
    .preview-frame { 
      width: 375px; 
      height: 667px; 
      border: 6px solid #333; 
      border-radius: 32px; 
      box-shadow: 0 0 40px rgba(0, 212, 255, 0.2);
      margin: 0 auto;
      display: block;
      background: white;
    }
    .phone-frame {
      background: linear-gradient(135deg, #1a1a2e, #0a0a0f);
      padding: 32px 16px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid var(--border-color);
    }
    .phone-notch {
      width: 120px;
      height: 6px;
      background: #333;
      border-radius: 3px;
      margin-bottom: 10px;
    }
    .phone-home {
      width: 36px;
      height: 36px;
      border: 2px solid #333;
      border-radius: 50%;
      margin-top: 10px;
    }

    /* 日志 */
    .log-content { 
      background: #0d0d14; 
      color: var(--neon-green); 
      padding: 16px; 
      border-radius: 8px; 
      max-height: 400px; 
      overflow-y: auto; 
      font-family: 'Consolas', monospace; 
      font-size: 12px; 
      white-space: pre-wrap;
      line-height: 1.6;
      border: 1px solid var(--border-color);
    }

    /* 操作历史 */
    .history-section {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--border-color);
    }
    .history-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--neon-blue);
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      text-shadow: 0 0 5px rgba(0, 212, 255, 0.3);
    }
    .history-item {
      display: flex;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(42, 42, 62, 0.5);
      font-size: 13px;
    }
    .history-item:last-child { border-bottom: none; }
    .history-time { 
      color: var(--text-secondary); 
      width: 150px;
      font-size: 12px;
      font-family: 'Consolas', monospace;
    }
    .history-action { flex: 1; color: var(--text-primary); }
    .history-status { 
      padding: 2px 10px; 
      border-radius: 4px; 
      font-size: 11px;
    }
    .history-success { 
      background: rgba(0, 255, 157, 0.1); 
      color: var(--neon-green);
      border: 1px solid rgba(0, 255, 157, 0.3);
    }
    .history-fail { 
      background: rgba(255, 45, 123, 0.1); 
      color: var(--neon-pink);
      border: 1px solid rgba(255, 45, 123, 0.3);
    }

    /* 进度条 */
    .progress-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10000;
    }

    /* Element Plus 赛博朋克覆盖 */
    .el-button--primary {
      background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple)) !important;
      border: none !important;
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
    }
    .el-button--primary:hover {
      box-shadow: 0 0 25px rgba(0, 212, 255, 0.5);
    }

    .el-button--warning {
      background: linear-gradient(135deg, var(--neon-yellow), #ff8c00) !important;
      border: none !important;
      color: #000 !important;
    }

    .el-button--success {
      background: linear-gradient(135deg, var(--neon-green), #00b377) !important;
      border: none !important;
    }

    .el-button--danger {
      background: linear-gradient(135deg, var(--neon-pink), #ff0055) !important;
      border: none !important;
    }

    .el-dialog {
      background: var(--bg-card) !important;
      border: 1px solid var(--border-color) !important;
      box-shadow: 0 0 40px rgba(0, 212, 255, 0.2) !important;
    }
    .el-dialog__title { color: var(--neon-blue) !important; }
    .el-dialog__header { border-bottom: 1px solid var(--border-color) !important; }

    .el-input__wrapper {
      background: var(--bg-secondary) !important;
      border: 1px solid var(--border-color) !important;
      box-shadow: none !important;
    }
    .el-input__inner { color: var(--text-primary) !important; }

    .el-card {
      background: var(--bg-card) !important;
      border: 1px solid var(--border-color) !important;
    }

    /* 响应式 */
    @media (max-width: 1200px) {
      .services-grid { 
      align-items: stretch; grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 768px) {
      .services-grid { 
      align-items: stretch; grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- 进度条 -->
    <div v-if="progress > 0" class="progress-overlay">
      <el-progress :percentage="progress" :stroke-width="3" :show-text="false" color="var(--neon-blue)" />
    </div>
    
    <div class="header">
      <h1>
        <span style="font-size: 24px;">⚡</span>
        CYBER DOCKER
      </h1>
      <div class="header-right">
        <el-switch v-model="autoRefresh" @change="toggleAutoRefresh" size="small" active-text="AUTO" inactive-text="" />
        <el-button @click="fetchContainers" :loading="loading" size="small">
          <el-icon><Refresh /></el-icon>
        </el-button>
        <el-button @click="logout" size="small" type="danger" plain>EXIT</el-button>
      </div>
    </div>

    <div class="container">
      <!-- 登录表单 -->
      <div v-if="!token" style="max-width: 380px; margin: 120px auto;">
        <el-card>
          <div style="text-align: center; margin-bottom: 24px;">
            <div style="font-size: 48px; margin-bottom: 12px;">⚡</div>
            <h3 style="color: var(--neon-blue); text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);">CYBER DOCKER</h3>
            <p style="color: var(--text-secondary); font-size: 13px; margin-top: 8px;">SYSTEM ACCESS REQUIRED</p>
          </div>
          <el-form @submit.prevent="login">
            <el-form-item>
              <el-input v-model="loginForm.username" placeholder="USER ID" size="large" />
            </el-form-item>
            <el-form-item>
              <el-input v-model="loginForm.password" type="password" placeholder="PASSWORD" size="large" @keyup.enter="login" />
            </el-form-item>
            <el-button type="primary" @click="login" :loading="loginLoading" size="large" style="width: 100%">
              JACK IN
            </el-button>
          </el-form>
        </el-card>
      </div>

      <!-- 主界面 -->
      <template v-else>
        <!-- Git 状态栏 -->
        <div class="git-bar">
          <span style="font-size: 16px;">📦</span>
          <span class="git-branch">{{ gitStatus.branch || 'main' }}</span>
          <span class="git-commit">{{ gitStatus.lastCommit || 'LOADING...' }}</span>
          <span v-if="gitStatus.changes?.length" class="git-changes" @click="showChanges = true">
            {{ gitStatus.changes.length }} CHANGES
          </span>
          <div style="flex: 1;"></div>
          <el-button size="small" text @click="fetchGitStatus" style="color: var(--neon-blue);">
            <el-icon><Refresh /></el-icon>
          </el-button>
        </div>

        <!-- 操作栏 -->
        <div class="action-bar">
          <el-space>
            <el-button type="primary" @click="updateAll" :loading="updating">
              ⚡ DEPLOY ALL
            </el-button>
            <el-button @click="gitPull" :loading="pulling" style="border-color: var(--neon-green); color: var(--neon-green);">
              📥 GIT PULL
            </el-button>
            <el-button @click="showPreview = !showPreview" style="border-color: var(--neon-purple); color: var(--neon-purple);">
              📱 {{ showPreview ? 'HIDE' : 'H5 PREVIEW' }}
            </el-button>
            <el-button @click="fetchSystemInfo" style="border-color: var(--neon-yellow); color: var(--neon-yellow);">
              ⚙️ SYSTEM
            </el-button>
          </el-space>
          <span style="font-size: 12px; color: var(--text-secondary); font-family: 'Consolas', monospace;">
            {{ lastRefresh }}
          </span>
        </div>

        <!-- 服务状态卡片 -->
        <div class="services-grid">
          <div v-for="svc in services" :key="svc.name" class="service-card">
            <div class="card-header">
              <div :class="['card-icon', svc.key]">
                {{ svc.emoji }}
              </div>
              <div class="card-title">
                <div class="card-name">{{ svc.name }}</div>
                <div class="card-port">:{{ svc.port }}</div>
              </div>
              <div :class="['status-indicator', svc.running ? 'running' : 'stopped']">
                <span class="status-dot"></span>
                {{ svc.running ? 'ONLINE' : 'OFFLINE' }}
              </div>
            </div>
            <div class="card-body">
              <div class="card-desc">{{ svc.desc }}</div>
              <div class="card-meta">
                <span>{{ svc.image || '-' }}</span>
                <span>{{ svc.uptime || '-' }}</span>
              </div>
            </div>
            <div class="card-actions">
              <div class="btn-group">
                <el-button size="small" type="primary" @click="updateService(svc.key)" :loading="svc.updating">UPDATE</el-button>
                <el-button size="small" @click="confirmRestart(svc)" style="border-color: var(--neon-yellow); color: var(--neon-yellow);">RESTART</el-button>
                <el-button size="small" :type="svc.running ? 'warning' : 'success'" @click="confirmToggle(svc)">{{ svc.running ? 'STOP' : 'START' }}</el-button>
                <el-button size="small" @click="viewLogs(svc.containerId, svc.name)" style="border-color: var(--neon-purple); color: var(--neon-purple);">LOGS</el-button>
              </div>
            </div>
          </div>
        </div>

        <!-- H5预览 -->
        <div v-if="showPreview" class="preview-section">
          <h3 style="margin-bottom: 20px; text-align: center; color: var(--neon-purple); text-shadow: 0 0 10px rgba(181, 55, 242, 0.5);">
            📱 H5 CLIENT PREVIEW
          </h3>
          <div style="text-align: center;">
            <div class="phone-frame">
              <div class="phone-notch"></div>
              <iframe :src="previewUrl" class="preview-frame" style="background: white; min-height: 667px;" frameborder="0" allowfullscreen></iframe>
              <div class="phone-home"></div>
            </div>
          </div>
          <div style="margin-top: 20px; text-align: center;">
            <el-button @click="showQrCode" style="border-color: var(--neon-blue); color: var(--neon-blue);">📷 QR CODE</el-button>
            <el-button @click="openPreview" style="border-color: var(--neon-green); color: var(--neon-green);">🔗 NEW WINDOW</el-button>
            <el-button @click="copyUrl" style="border-color: var(--neon-yellow); color: var(--neon-yellow);">📋 COPY URL</el-button>
          </div>
        </div>

        <!-- 操作历史 -->
        <div class="history-section">
          <div class="history-title">📋 OPERATION LOG</div>
          <div v-if="history.length === 0" style="color: var(--text-secondary); font-size: 13px; padding: 20px 0; text-align: center;">
            NO OPERATIONS RECORDED
          </div>
          <div v-for="item in history" :key="item.time" class="history-item">
            <span class="history-time">{{ item.time }}</span>
            <span class="history-action">{{ item.action }}</span>
            <span :class="['history-status', item.success ? 'history-success' : 'history-fail']">
              {{ item.success ? 'SUCCESS' : 'FAILED' }}
            </span>
          </div>
        </div>

        <!-- 未提交更改对话框 -->
        <el-dialog v-model="showChanges" title="UNCOMMITTED CHANGES" width="500px">
          <div v-if="gitStatus.changes?.length">
            <div v-for="file in gitStatus.changes" :key="file" style="padding: 10px 0; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 8px;">
              <el-tag :type="file.startsWith('??') ? 'info' : 'warning'" size="small">
                {{ file.startsWith('??') ? 'NEW' : 'MOD' }}
              </el-tag>
              <span style="font-size: 13px; color: var(--text-primary); font-family: 'Consolas', monospace;">
                {{ file.replace(/^[AM?]+\s+/, '') }}
              </span>
            </div>
          </div>
        </el-dialog>

        <!-- 系统信息 -->
        <el-dialog v-model="showSystemInfo" title="SYSTEM INFO" width="480px">
          <el-descriptions :column="1" border v-if="systemInfo" size="small">
            <el-descriptions-item label="CONTAINERS">{{ systemInfo.containers }}</el-descriptions-item>
            <el-descriptions-item label="RUNNING">
              <el-tag type="success" size="small">{{ systemInfo.containersRunning }}</el-tag>
            </el-descriptions-item>
            <el-descriptions-item label="STOPPED">
              <el-tag type="danger" size="small">{{ systemInfo.containersStopped }}</el-tag>
            </el-descriptions-item>
            <el-descriptions-item label="IMAGES">{{ systemInfo.images }}</el-descriptions-item>
            <el-descriptions-item label="OS">{{ systemInfo.os }}</el-descriptions-item>
            <el-descriptions-item label="KERNEL">{{ systemInfo.kernel }}</el-descriptions-item>
            <el-descriptions-item label="DOCKER">{{ systemInfo.dockerVersion }}</el-descriptions-item>
          </el-descriptions>
        </el-dialog>

        <!-- 日志对话框 -->
        <el-dialog v-model="showLogDialog" :title="logTitle" width="800px">
          <template #header>
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span style="color: var(--neon-green);">{{ logTitle }}</span>
              <el-space>
                <el-button size="small" @click="refreshLogs" style="border-color: var(--neon-blue); color: var(--neon-blue);">REFRESH</el-button>
                <el-button size="small" @click="clearLogs" style="border-color: var(--neon-pink); color: var(--neon-pink);">CLEAR</el-button>
              </el-space>
            </div>
          </template>
          <div class="log-content">{{ logs || 'NO LOGS' }}</div>
        </el-dialog>

        <!-- 二维码对话框 -->
        <el-dialog v-model="showQrCodeDialog" title="H5 PREVIEW QR" width="320px">
          <div style="text-align: center; padding: 20px 0;">
            <img v-if="qrCodeUrl" :src="qrCodeUrl" style="max-width: 180px; border-radius: 8px; border: 2px solid var(--border-color);" />
            <p style="margin-top: 16px; color: var(--neon-blue); font-size: 13px;">SCAN TO ACCESS H5</p>
            <p style="font-size: 12px; color: var(--text-secondary); margin-top: 8px; font-family: 'Consolas', monospace;">{{ previewUrl }}</p>
          </div>
        </el-dialog>
      </template>
    </div>
  </div>

  <script>
    const { createApp, ref, reactive, onMounted, onUnmounted } = Vue;
    const { ElMessage, ElMessageBox } = ElementPlus;

    const app = createApp({
      setup() {
        const token = ref(localStorage.getItem('devops_token') || '');
        const loading = ref(false);
        const loginLoading = ref(false);
        const updating = ref(false);
        const pulling = ref(false);
        const showPreview = ref(false);
        const showSystemInfo = ref(false);
        const showLogDialog = ref(false);
        const showQrCodeDialog = ref(false);
        const showChanges = ref(false);
        const autoRefresh = ref(true);
        const progress = ref(0);
        const systemInfo = ref(null);
        const logs = ref('');
        const logTitle = ref('CONTAINER LOGS');
        const qrCodeUrl = ref('');
        const lastRefresh = ref('-');
        const currentLogId = ref('');
        const previewUrl = ref("https://" + window.location.host + "/miniapp/");
        let refreshTimer = null;

        const loginForm = reactive({ username: 'admin', password: 'admin123' });
        const gitStatus = reactive({ branch: '', lastCommit: '', changes: [] });
        const history = ref([]);

        const services = reactive([
          { name: 'API SERVER', key: 'server', port: 3001, desc: 'NestJS Backend Service', emoji: '⚡', containerId: '', running: false, updating: false, image: '', uptime: '' },
          { name: 'ADMIN PANEL', key: 'admin', port: 8080, desc: 'Vue 3 Admin Dashboard', emoji: '🖥️', containerId: '', running: false, updating: false, image: '', uptime: '' },
          { name: 'H5 CLIENT', key: 'miniapp', port: 8081, desc: 'uni-app Mobile Client', emoji: '📱', containerId: '', running: false, updating: false, image: '', uptime: '' },
          { name: 'MOCK SERVER', key: 'mock-server', port: 3000, desc: 'Development Mock Data', emoji: '🎭', containerId: '', running: false, updating: false, image: '', uptime: '' }
        ]);

        const api = axios.create({
          baseURL: '/devops/api/docker',
          headers: { Authorization: `Bearer ${token.value}` }
        });

        function addHistory(action, success) {
          const now = new Date();
          const time = now.toLocaleString('zh-CN', { hour12: false });
          history.value.unshift({ time, action, success });
          if (history.value.length > 10) history.value.pop();
        }

        async function login() {
          loginLoading.value = true;
          try {
            const res = await axios.post('/api/auth/admin-login', loginForm);
            if (res.data.code === 0) {
              token.value = res.data.data.token;
              localStorage.setItem('devops_token', token.value);
              api.defaults.headers.Authorization = `Bearer ${token.value}`;
              ElMessage.success('ACCESS GRANTED');
              fetchContainers();
              fetchGitStatus();
            }
          } catch (err) {
            ElMessage.error('ACCESS DENIED');
          } finally {
            loginLoading.value = false;
          }
        }

        function logout() {
          token.value = '';
          localStorage.removeItem('devops_token');
          stopAutoRefresh();
        }

        async function fetchContainers() {
          loading.value = true;
          try {
            const res = await api.get('/containers');
            if (res.data.code === 0) {
              const containers = res.data.data;
              services.forEach(svc => {
                const container = containers.find(c => c.name?.includes(svc.key));
                if (container) {
                  svc.containerId = container.id;
                  svc.running = container.state === 'running';
                  svc.image = container.image?.replace('app-', '') || '';
                }
              });
              lastRefresh.value = new Date().toLocaleTimeString('zh-CN');
            }
          } catch (err) {
            if (err.response?.status === 401) logout();
          } finally {
            loading.value = false;
          }
        }

        async function fetchGitStatus() {
          try {
            const res = await api.get('/git/status');
            if (res.data.code === 0) Object.assign(gitStatus, res.data.data);
          } catch (err) {}
        }

        async function updateAll() {
          await ElMessageBox.confirm('DEPLOY ALL SERVICES?', 'CONFIRM', { type: 'warning' });
          updating.value = true;
          progress.value = 0;
          const timer = setInterval(() => { if (progress.value < 90) progress.value += 10; }, 500);
          try {
            const res = await api.post('/update/all');
            ElMessage.success(res.data.message);
            addHistory('DEPLOY ALL', true);
            fetchContainers();
          } catch (err) {
            ElMessage.error(err.response?.data?.message || 'DEPLOY FAILED');
            addHistory('DEPLOY ALL', false);
          } finally {
            clearInterval(timer);
            progress.value = 100;
            setTimeout(() => { progress.value = 0; }, 1000);
            updating.value = false;
          }
        }

        async function updateService(service) {
          const svc = services.find(s => s.key === service);
          svc.updating = true;
          try {
            const res = await api.post(`/update/${service}`);
            ElMessage.success(res.data.message);
            addHistory(`UPDATE ${svc.name}`, true);
            fetchContainers();
          } catch (err) {
            ElMessage.error(err.response?.data?.message || 'UPDATE FAILED');
            addHistory(`UPDATE ${svc.name}`, false);
          } finally {
            svc.updating = false;
          }
        }

        async function gitPull() {
          pulling.value = true;
          try {
            const res = await api.post('/git/pull');
            ElMessage.success(res.data.message);
            addHistory('GIT PULL', true);
            fetchGitStatus();
          } catch (err) {
            ElMessage.error(err.response?.data?.message || 'PULL FAILED');
            addHistory('GIT PULL', false);
          } finally {
            pulling.value = false;
          }
        }

        async function confirmRestart(svc) {
          await ElMessageBox.confirm(`RESTART ${svc.name}?`, 'CONFIRM', { type: 'warning' });
          try {
            await api.post(`/containers/${svc.containerId}/restart`);
            ElMessage.success(`${svc.name} RESTARTED`);
            addHistory(`RESTART ${svc.name}`, true);
            fetchContainers();
          } catch (err) {
            ElMessage.error('RESTART FAILED');
            addHistory(`RESTART ${svc.name}`, false);
          }
        }

        async function confirmToggle(svc) {
          const action = svc.running ? 'STOP' : 'START';
          await ElMessageBox.confirm(`${action} ${svc.name}?`, 'CONFIRM', { type: 'warning' });
          try {
            await api.post(`/containers/${svc.containerId}/${svc.running ? 'stop' : 'start'}`);
            ElMessage.success(`${svc.name} ${action}PED`);
            addHistory(`${action} ${svc.name}`, true);
            fetchContainers();
          } catch (err) {
            ElMessage.error(`${action} FAILED`);
            addHistory(`${action} ${svc.name}`, false);
          }
        }

        async function viewLogs(id, name) {
          logTitle.value = `${name} - LOGS`;
          currentLogId.value = id;
          try {
            const res = await api.get(`/containers/${id}/logs`);
            logs.value = res.data.data || 'NO LOGS';
            showLogDialog.value = true;
          } catch (err) {
            ElMessage.error('FETCH LOGS FAILED');
          }
        }

        async function refreshLogs() {
          if (currentLogId.value) {
            const res = await api.get(`/containers/${currentLogId.value}/logs`);
            logs.value = res.data.data || 'NO LOGS';
          }
        }

        function clearLogs() { logs.value = ''; }

        async function fetchSystemInfo() {
          try {
            const res = await api.get('/system/info');
            systemInfo.value = res.data.data;
            showSystemInfo.value = true;
          } catch (err) {
            ElMessage.error('FETCH SYSTEM INFO FAILED');
          }
        }

        async function showQrCode() {
          try {
            const res = await api.get('/miniapp/qrcode');
            qrCodeUrl.value = res.data.data.qrcode;
            showQrCodeDialog.value = true;
          } catch (err) {
            ElMessage.error('GENERATE QR FAILED');
          }
        }

        function openPreview() { window.open(previewUrl.value, '_blank'); }
        function copyUrl() {
          navigator.clipboard.writeText(previewUrl.value).then(() => ElMessage.success('COPIED'));
        }

        function toggleAutoRefresh(val) { val ? startAutoRefresh() : stopAutoRefresh(); }
        function startAutoRefresh() {
          stopAutoRefresh();
          refreshTimer = setInterval(() => { fetchContainers(); fetchGitStatus(); }, 30000);
        }
        function stopAutoRefresh() {
          if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
        }

        onMounted(() => {
          if (token.value) {
            api.defaults.headers.Authorization = `Bearer ${token.value}`;
            fetchContainers();
            fetchGitStatus();
            if (autoRefresh.value) startAutoRefresh();
          }
        });
        onUnmounted(() => stopAutoRefresh());

        return {
          token, loading, loginLoading, updating, pulling,
          showPreview, showSystemInfo, showLogDialog, showQrCodeDialog,
          showChanges, autoRefresh, progress,
          systemInfo, logs, logTitle, qrCodeUrl, lastRefresh, previewUrl,
          loginForm, services, gitStatus, history,
          login, logout, fetchContainers, fetchGitStatus,
          updateAll, updateService, gitPull,
          confirmRestart, confirmToggle,
          viewLogs, refreshLogs, clearLogs,
          fetchSystemInfo, showQrCode, openPreview, copyUrl,
          toggleAutoRefresh
        };
      }
    });

    app.use(ElementPlus);
    app.mount('#app');
  </script>
</body>
</html>
